name: Night Shift probe contract

on:
  pull_request:
    branches:
      - main
      - 'probe/night-shift-v0.1'
    paths:
      - '.night-shift/**'
      - '.github/workflows/night-shift-probe-ci.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run policy contract tests
        run: node --test .night-shift/test/policy.test.mjs .night-shift/test/security.test.mjs
      - name: Validate n8n workflow structure
        run: node .night-shift/test/validate-workflow.mjs

  adversarial-gates:
    if: startsWith(github.head_ref, 'probe/night-shift-x-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Scope gate
        id: scope
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .night-shift/test/validate-pr.mjs

      - name: Deterministic secret-pattern gate
        id: pattern
        if: steps.scope.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .night-shift/test/scan-diff-secrets.mjs

      - name: Gitleaks defense-in-depth scan
        id: gitleaks
        if: steps.scope.outcome == 'success' && steps.pattern.outcome == 'success'
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute deterministic verdict
        id: verdict
        if: always()
        env:
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          PATTERN_OUTCOME: ${{ steps.pattern.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          if [ "$SCOPE_OUTCOME" != "success" ]; then
            echo "verdict=SCOPE_BLOCK" >> "$GITHUB_OUTPUT"
          elif [ "$PATTERN_OUTCOME" != "success" ] || [ "$GITLEAKS_OUTCOME" != "success" ]; then
            echo "verdict=SECURITY_BLOCK" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build per-task execution summary
        if: always()
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          PATTERN_OUTCOME: ${{ steps.pattern.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          {
            echo "<!-- night-shift-x-test-summary -->"
            echo "### Night-Shift Execution Summary"
            echo
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Head: \`$GITHUB_HEAD_REF\`"
            echo "- Base SHA: \`${{ github.event.pull_request.base.sha }}\`"
            echo "- Scope gate: \`$SCOPE_OUTCOME\`"
            echo "- Secret-pattern gate: \`$PATTERN_OUTCOME\`"
            echo "- Gitleaks: \`$GITLEAKS_OUTCOME\`"
            echo "- Verdict: **$VERDICT**"
            echo "- Cost: \`DATA_GAP\`"
            echo "- Merge authority: \`false\`"
          } > /tmp/night-shift-summary.md
          cat /tmp/night-shift-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/night-shift-summary.md

      - name: Enforce gate verdict
        if: always() && steps.verdict.outputs.verdict != 'PASS'
        run: |
          echo "Night Shift gate blocked PR: ${{ steps.verdict.outputs.verdict }}"
          exit 1
